[project]
name = "anatomiae"
version = "0.1.0"
description = "Causal Anatomy of Political Behavior in Language Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.5",
  "transformers>=4.46",
  "vllm>=0.6.3",
  "datasets>=3.0",
  "huggingface-hub>=0.26",
  "hf-transfer>=0.1.8",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26,<2.0",
  "tqdm>=4.66",
  "tenacity>=9.0",
  "typer>=0.13",
  "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "pyright>=1.1",
]
analysis = [
  "matplotlib>=3.9",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anatomiae"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
