# Download manifest for the anatomiae pilot.
# Tiers follow the research spec (§34): Tier 1 = smoke test, Tier 2 = locked
# anchors, Tier 3 = control families, Tier 4+ = future longitudinal/lineage
# expansion. `status` is updated as downloads happen; nothing here is
# fetched automatically just by editing this file.
#
# HF cache reused: HF_HOME=/data/jackb/krasis/huggingface (existing,
# jackb-owned, already has partial model metadata cached; avoids a
# duplicate multi-hundred-GB cache under /home). See docs/MODEL_AUDIT.md.

artifacts:
  # ---- Tier 1: smoke test ----
  - id: olmo2-1b-instruct-smoke
    repository: allenai/OLMo-2-0425-1B-Instruct
    revision: main
    type: model
    tier: 1
    estimated_size_gb: 2
    destination: hf_cache
    status: done
    scientific_purpose: >
      Smoke-test the download -> GPU-guard -> Transformers-backend ->
      generation -> raw-output-capture chain end to end before committing
      to 13B-scale downloads. Used 1B instead of the originally planned 7B
      to get a result faster given the measured ~2.3 MB/s link bandwidth
      (see docs/MODEL_AUDIT.md). Result: PASS - real generation captured
      at artifacts/logs/smoke_test_result.json, GPU isolation verified
      live (physical index 1, UUID matched). vLLM backend smoke test on a
      small model is still pending (transformers-only so far).

  # ---- Tier 2: locked model anchors ----
  - id: olmo2-13b-base
    repository: allenai/OLMo-2-1124-13B
    revision: main
    type: model
    tier: 2
    estimated_size_gb: 52  # CORRECTED: weights are fp32, not bf16 as first assumed (13B*4B=52GB, matches exactly)
    actual_size_gb: 52
    destination: hf_cache
    status: done
    elapsed_seconds: 22837
    scientific_purpose: "Locked anchor A: pretrained base state (§6)."

  - id: olmo2-13b-sft
    repository: allenai/OLMo-2-1124-13B-SFT
    revision: main
    type: model
    tier: 2
    estimated_size_gb: 27  # HF safetensors metadata unavailable for this specific repo (checked);
                            # DPO/RLVR2 in the same lineage are confirmed BF16 (~27GB) - only the
                            # Base checkpoint is fp32 (52GB). Using the DPO/RLVR2 figure as the
                            # working estimate until this one finishes and the real size is known.
    destination: hf_cache
    status: downloading
    scientific_purpose: "Locked anchor A: SFT stage."

  - id: olmo2-13b-dpo
    repository: allenai/OLMo-2-1124-13B-DPO
    revision: main
    type: model
    tier: 2
    estimated_size_gb: 27  # verified via HF safetensors metadata: BF16, 13.7B params
    destination: hf_cache
    status: pending
    scientific_purpose: "Locked anchor A: DPO stage."

  - id: olmo2-13b-instruct-rlvr2
