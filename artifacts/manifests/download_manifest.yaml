    type: model
    tier: 2
    estimated_size_gb: 27  # verified via HF safetensors metadata: BF16, 13.7B params
    destination: hf_cache
    status: pending
    scientific_purpose: >
      Locked anchor A: final RLVR-post-trained state. RLVR1 also exists
      (allenai/OLMo-2-1124-13B-Instruct-RLVR1) as an intermediate RLVR
      checkpoint; download if stage-wise RLVR movement is analyzed.

